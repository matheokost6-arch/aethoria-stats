# AethoriaStats : statistiques publiques et panneau d'administration, servis par une petite API HTTP.

api:
  enabled: true
  # Ne change pas "bind" : l'API ne doit être joignable que depuis le serveur lui-même.
  # C'est le serveur web (Caddy) placé devant qui l'ouvre en HTTPS.
  bind: "127.0.0.1"
  port: 8765
  # Sites autorisés à appeler l'API depuis un navigateur (http://localhost:* l'est toujours, pour les tests).
  allowed-origins:
    - "https://matheokost6-arch.github.io"
  # Durée d'une connexion au panneau, en heures.
  session-hours: 12
  # Délai de mise à jour des stats publiques, en secondes (5 minimum).
  stats-refresh-seconds: 20

# Comptes du panneau. Ne remplis JAMAIS cette liste à la main :
# dans la CONSOLE du serveur, tape  /astats setpass <nom> <mot de passe> [admin|modo]
# (10 caractères minimum). Seul un hash PBKDF2 est écrit ici, pas le mot de passe.
# Rôles : admin = tout ; modo = tout sauf la console libre et le bannissement définitif.
admins: []

# true : les pseudos sont remplacés par "Joueur-xxxx" dans les stats publiques.
hide-player-names: false

# Fuseau horaire pour les jours et heures des graphiques (ex. "Europe/Paris").
# Vide = fuseau du serveur.
timezone: ""

# --- Ancien envoi vers un Gist GitHub : désactivé tant que gist-id et github-token sont vides. ---
gist-id: ""
github-token: ""
gist-file: "stats.json"
send-interval-seconds: 120
